# Añade este bloque a tu Caddyfile y recarga Caddy.
# Protege /cloud con basic_auth (genera hash: caddy hash-password --plaintext 'CLAVE')

tu.dominio.com {
    encode zstd gzip

    handle /cloud* {
        basic_auth {
            admin "$2a$14$REEMPLAZA_CON_TU_HASH"
        }
        request_body {
            max_size 0
        }
        reverse_proxy 127.0.0.1:3100 {
            transport http {
                read_timeout  2h
                write_timeout 2h
            }
        }
    }
}
