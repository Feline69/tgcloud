services:
  cloud:
    build: .
    container_name: tgcloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      PORT: 3000
      BASE_PATH: /cloud
      UPLOAD_TMP: /tmp/cloud-uploads
      DATA_DIR: /data
      MAX_CHUNK_MB: 1950
      DL_WORKERS: 4
    volumes:
      - cloud_data:/data
      - /tmp/cloud-uploads:/tmp/cloud-uploads

volumes:
  cloud_data:
